<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100d0d">
  <meta name="description" content="Velumbra: prólogo interativo de um jogo de tarô e horror em pixel art.">
  <title>Velumbra</title>
  <link rel="icon" type="image/png" href="./public/brand/velumbra-icon.png">
  <link rel="preload" as="image" href="./public/art/cabin-pixel.png">
  <link rel="preload" as="image" href="./public/art/elder-pixel.png">
  <link rel="preload" as="font" type="font/ttf" href="./public/fonts/velumbra.ttf" crossorigin>
  <link rel="stylesheet" href="./src/cabin.css">
  <script type="module" src="./src/prologue.js"></script>
</head>
<body>
  <svg class="object-drawings" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="cards" viewBox="0 0 24 24"><path d="M7 3h13v17H7zM3 7v16h13M10 7h7v9h-7z"/></symbol>
    <symbol id="journal" viewBox="0 0 24 24"><path d="M4 3h16v19H4zM8 3v19M11 8h6M11 12h6M11 16h4"/></symbol>
    <symbol id="tuning" viewBox="0 0 24 24"><path d="M5 3v18M12 3v18M19 3v18M2 8h6M9 16h6M16 6h6"/></symbol>
    <symbol id="speaker" viewBox="0 0 24 24"><path d="M3 9h4l6-5v16l-6-5H3zM17 8v8M21 5v14"/></symbol>
  </defs></svg>
  <div class="scene" aria-hidden="true"><canvas id="room"></canvas><div class="vignette"></div></div>
  <section class="intro" id="intro" aria-label="Abertura de Velumbra">
    <div class="intro-mark"><img src="./public/brand/velumbra-icon.png" alt="Ícone de Velumbra: uma velha sob um véu e uma vela" width="1254" height="1254"></div>
    <h1 class="intro-title">VELUMBRA</h1>
    <div class="entrance"><button id="skip-intro">Entrar com som</button><button id="silent-entry">Entrar em silêncio</button></div>
  </section>
  <main class="menu" id="menu" inert hidden>
    <header class="topbar">
      <h1 id="game-title" tabindex="-1">VELUMBRA</h1>
      <nav class="tools" aria-label="Controles da cabana">
        <button class="tool" data-panel="decks" aria-label="Baralhos" title="Baralhos"><svg aria-hidden="true"><use href="#cards"/></svg><span>Baralhos</span></button>
        <button class="tool diary-tool" data-panel="journal" aria-label="Diário" title="Diário"><svg aria-hidden="true"><use href="#journal"/></svg><span>Diário</span></button>
        <button class="tool" data-panel="settings" aria-label="Som e movimento" title="Som e movimento"><svg aria-hidden="true"><use href="#tuning"/></svg><span>Ajustes</span></button>
        <button class="tool audio-toggle" id="audio-toggle" aria-pressed="false" aria-label="Ouvir a cabana" title="Ouvir a cabana"><svg aria-hidden="true"><use href="#speaker"/></svg><span id="audio-label">Som</span></button>
      </nav>
    </header>
    <div class="entity-stage" id="entity-stage">
      <button class="entity" id="portrait" aria-label="Falar com a velha"><canvas id="elder" width="180" height="240" aria-hidden="true"></canvas></button>
      <div class="whisper" id="whisper" role="status" aria-live="polite" hidden><p>Diga seu nome.</p></div>
    </div>
    <button class="table-area" id="table-area" aria-label="Mesa: informar seu nome" tabindex="-1"></button>
    <form id="table-form" class="table-form">
      <label class="sr-only" for="table-name">Qual seu nome?</label>
      <div class="name-line"><input id="table-name" name="name" placeholder="Qual seu nome?" autocomplete="given-name" minlength="2" maxlength="32" required aria-describedby="name-error"><button type="submit" class="name-enter" aria-label="Confirmar nome" title="Confirmar nome">→</button></div>
      <p class="error" id="name-error" role="alert" hidden></p>
    </form>
  </main>
  <p class="sr-only" id="audio-status" role="status" aria-live="polite"></p>
  <dialog id="panel" aria-labelledby="panel-title"><div class="dialog-shell"><header class="dialog-header"><h2 id="panel-title" tabindex="-1"></h2><button id="close-panel" class="close-button" aria-label="Voltar à cabana">×</button></header><div id="panel-content"></div><footer class="dialog-footer"><span>VELUMBRA</span><kbd>ESC</kbd></footer></div></dialog>
  <noscript><div class="noscript">Ative o JavaScript para abrir Velumbra.</div></noscript>
</body>
</html>
