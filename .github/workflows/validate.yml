name: Validar prólogo

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prologue:
    name: Regressões e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check src/prologue.js
      - run: npm run build
