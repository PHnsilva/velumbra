name: Entrega verificável
description: Contexto, resultado, aceite, dependências, sprint e tamanho antes de executar.
body:
  - type: textarea
    id: context
    attributes:
      label: Contexto e evidência
      description: Estado observado, fontes, exemplos sanitizados; distinga fato de hipótese.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Resultado esperado e requisitos
      description: Comportamento ou decisão verificável; referencie RF/RNF quando aplicável.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo e limites
      description: Inclui/exclui, contratos preservados, dados e custo. Dúvidas precisam de decisão antes da implementação.
    validations:
      required: true
  - type: input
    id: sprint
    attributes:
      label: Sprint
      description: Sprint do plano aprovado (S1–S5 ou S6 de validação/mudanças); governança anterior ao plano deve declarar pré-planejamento.
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Tamanho da issue
      description: Considere dificuldade, volume, integração e validação. Aplicar também a label size correspondente.
      options:
        - PP (1 unidade)
        - P (2 unidades)
        - M (4 unidades)
        - L (8 unidades)
    validations:
      required: true
  - type: textarea
    id: estimate
    attributes:
      label: Justificativa do tamanho
      description: Explique esforço relativo e incertezas; não é estimativa de horas.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Condições observáveis de sucesso, erro e limites; o aceite é de Pedro.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validação e evidências
      description: Ambiente, procedimento, resultado esperado e evidência do PR; identifique mocks e integrações reais.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependências e decisões
      description: B bloqueada por A, artefato necessário, responsável e condição de liberação. Se não há bloqueio, declare.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Pontos de partida
      description: Arquivos, contratos, issues, PRs e fontes; sem dados privados ou credenciais.
